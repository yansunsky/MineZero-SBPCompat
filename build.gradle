plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

group = 'boomcow.minezero.extension'
version = project.findProperty('mod_version') ?: '1.0.0'

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            programArgument '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mixin：ForgeGradle 5.x 自动提供 mixin 扩展，负责生成 refmap（official→SRG）。
// 配合 mods.toml 的 [[mixins]] 与源码中的 remap=false 使用。
mixin {
    add sourceSets.main, "minezero_extension.mixins.json"
}

repositories {
    mavenCentral()
}

dependencies {
    // Forge 引擎（由 ForgeGradle 注入对应版本）
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // 可选前置（编译期需要其 API；运行期由 ModList.isLoaded 守卫）。
    // 统一引用 run/mods 中已放入的真实 jar，并经 fg.deobf 重映射至 dev 映射（official），
    // 以保证编译期方法/字段名与本模组开发环境一致。
    compileOnly fg.deobf(files(
        'run/mods/curios-forge-5.14.1+1.20.1.jar',
        'run/mods/sophisticatedbackpacks-1.20.1-3.24.58.1917.jar',
        'run/mods/sophisticatedcore-1.20.1-1.3.55.2031.jar'
    ))
    // MineZero 本体：用户构建的 1.20.1 版，官方映射已与 dev 环境一致，直接引用即可。
    compileOnly files('run/mods/MineZero-1.1.0.jar')
}

// 资源中的占位符替换（mods.toml 模板）
processResources {
    filesMatching('META-INF/mods.toml') {
        expand project.properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
